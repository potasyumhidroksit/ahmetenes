# Build scripts: allow only what each runtime needs; rest false so
# strictDepBuilds (pnpm >=10.26 / 11) passes.
allowBuilds:
  esbuild: true
  sharp: true

# Supply-chain hardening: cooldown on brand-new releases (EmDash exempt)
# and no non-registry transitive sources. (No trustPolicy: no-downgrade --
# it trips on upstream provenance regressions we don't control.)
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - emdash
  - "@emdash-cms/*"
blockExoticSubdeps: true

# Geçişli bağımlılık açıkları (Dependabot, 2026-10-02): devalue (astro/emdash üzerinden) ve dompurify.
# 2026-10-14 (ship audit, yüksek): sharp, http-cache-semantics (astro), source-map-js (svgo/vite),
# @modelcontextprotocol/sdk (emdash); orta: smol-toml. Hepsi üst paketlerin bildirdiği aralık içinde.
overrides:
  'devalue@<5.9.3': '^5.9.3'
  'dompurify@<3.4.16': '^3.4.16'
  'sharp@<0.35.5': '^0.35.5'
  'http-cache-semantics@<4.2.1': '^4.2.1'
  'source-map-js@<1.2.2': '^1.2.2'
  '@modelcontextprotocol/sdk@<1.31.0': '^1.31.0'
  'smol-toml@<1.8.1': '^1.8.1'
